<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 788" width="1180" height="788" role="img" aria-labelledby="rolesTitle rolesDesc">
  <title id="rolesTitle">Three ends, one shared model: who does what, and how it hands off</title>
  <desc id="rolesDesc">Owner, shop and technician on one server-side permission boundary</desc>

  <style>
    :root {
      --card: #ffffff; --lane: #f6f8fa; --border: #d0d7de;
      --title: #1f2328; --muted: #59636e; --line: #8c959f; --dot: #0969da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: #161b22; --lane: #10151b; --border: #30363d;
        --title: #e6edf3; --muted: #9198a1; --line: #6e7681; --dot: #58a6ff;
      }
      .acc-owner { fill: #4493f8; }
      .acc-merchant { fill: #3fb950; }
      .acc-technician { fill: #ab7df8; }
      .acc-shared { fill: #d29922; }
    }
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .acc-owner { fill: #0969da; }
    .acc-merchant { fill: #1a7f37; }
    .acc-technician { fill: #8250df; }
    .acc-shared { fill: #bf8700; }
    .lane { fill: var(--lane); stroke: var(--border); stroke-width: 1; }
    .chip { fill: var(--card); stroke: var(--border); stroke-width: 1; }
    .badge { fill: var(--card); stroke-width: 1.2; }
    .note { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 4; }
    .t-head { fill: var(--title); font-size: 14px; font-weight: 600; }
    .t-headsub { fill: var(--muted); font-size: 10.5px; }
    .t-stage { fill: var(--title); font-size: 11.5px; font-weight: 600; }
    .t-stagenum { fill: var(--muted); font-size: 9px; letter-spacing: .1em; }
    .t-role { fill: var(--title); font-size: 12.5px; font-weight: 700; }
    .t-rolesub { fill: var(--muted); font-size: 8.8px; }
    .t-chip { fill: var(--title); font-size: 10px; }
    .t-note { fill: var(--muted); font-size: 9.5px; font-style: italic; }
    .t-hand { fill: var(--muted); font-size: 9px; }
    .t-badge { font-size: 9px; font-weight: 700; }
    .t-legend { fill: var(--muted); font-size: 9.5px; }
    .t-caption { fill: var(--muted); font-size: 9.5px; }
    .hand { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .hand-dash { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 4 4; opacity: .9; animation: dash 1.6s linear infinite; }
    .arw-head { fill: var(--line); }
    .dot { fill: var(--dot); }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .hand-dash { animation: none; }
      .pkt { display: none; }
    }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 8 8" refX="6.4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arw-head" d="M 0.6 1.2 L 6.4 4 L 0.6 6.8 z"/>
    </marker>
  </defs>

  <text class="t-head" x="8" y="26">Three ends, one shared model: who does what, and how it hands off</text>
  <text class="t-headsub" x="8" y="43">Owner, shop and technician on one server-side permission boundary</text>

  <!-- stages -->
  <text class="t-stagenum" x="222" y="64" text-anchor="middle">01</text>
  <text class="t-stage" x="222" y="80" text-anchor="middle">Booking &amp; quote</text>
  <text class="t-stagenum" x="394" y="64" text-anchor="middle">02</text>
  <text class="t-stage" x="394" y="80" text-anchor="middle">Reception check</text>
  <text class="t-stagenum" x="566" y="64" text-anchor="middle">03</text>
  <text class="t-stage" x="566" y="80" text-anchor="middle">Dispatch &amp; work</text>
  <text class="t-stagenum" x="738" y="64" text-anchor="middle">04</text>
  <text class="t-stage" x="738" y="80" text-anchor="middle">QC signature</text>
  <text class="t-stagenum" x="910" y="64" text-anchor="middle">05</text>
  <text class="t-stage" x="910" y="80" text-anchor="middle">Redemption</text>
  <text class="t-stagenum" x="1082" y="64" text-anchor="middle">06</text>
  <text class="t-stage" x="1082" y="80" text-anchor="middle">Review &amp; archive</text>

  <!-- lane: owner -->
  <g>
    <rect class="lane" x="8" y="96" width="1164" height="138" rx="10"/>
    <rect class="acc-owner" x="8" y="96" width="3" height="138" rx="1.5"/>
    <text class="t-role" x="22" y="161.0">Owner</text>
    <text class="t-rolesub" x="22" y="177.0">WeChat mini program</text>
    <rect class="chip" x="144" y="106" width="156" height="34" rx="6"/>
    <rect x="144" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="155" y="120.5">Add car: manual / VIN /</text>
    <text class="t-chip" x="155" y="132.5">OCR</text>

    <rect class="chip" x="144" y="148" width="156" height="34" rx="6"/>
    <rect x="144" y="148" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="155" y="168.6">Versioned shop quotes</text>

    <rect class="chip" x="144" y="190" width="156" height="34" rx="6"/>
    <rect x="144" y="190" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="155" y="204.5">Pick a slot, pay by</text>
    <text class="t-chip" x="155" y="216.5">coupon</text>

    <rect class="chip" x="316" y="106" width="156" height="34" rx="6"/>
    <rect x="316" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="327" y="126.6">Check reception sheet</text>

    <rect class="chip" x="316" y="148" width="156" height="34" rx="6"/>
    <rect x="316" y="148" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="327" y="168.6">Confirm, or object</text>

    <rect class="chip" x="488" y="106" width="156" height="34" rx="6"/>
    <rect x="488" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="499" y="126.6">Watch progress and photos</text>

    <rect class="chip" x="488" y="148" width="156" height="34" rx="6"/>
    <rect x="488" y="148" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="499" y="168.6">Grant archive reads</text>

    <rect class="chip" x="660" y="106" width="156" height="34" rx="6"/>
    <rect x="660" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="671" y="126.6">See QC photos and defects</text>

    <rect class="chip" x="832" y="106" width="156" height="34" rx="6"/>
    <rect x="832" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="843" y="126.6">Show the six-digit code</text>

    <rect class="chip" x="832" y="148" width="156" height="34" rx="6"/>
    <rect x="832" y="148" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="843" y="168.6">Compare intake vs done</text>

    <rect class="chip" x="832" y="190" width="156" height="34" rx="6"/>
    <rect x="832" y="190" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="843" y="210.6">Missing shows as missing</text>

    <rect class="chip" x="1004" y="106" width="156" height="34" rx="6"/>
    <rect x="1004" y="106" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="1015" y="126.6">Rate, review, add photos</text>

    <rect class="chip" x="1004" y="148" width="156" height="34" rx="6"/>
    <rect x="1004" y="148" width="2.5" height="34" rx="1.25" fill="#0969da" opacity=".85"/>
    <text class="t-chip" x="1015" y="162.5">Archive, health,</text>
    <text class="t-chip" x="1015" y="174.5">reminders</text>

  </g>

  <!-- lane: merchant -->
  <g>
    <rect class="lane" x="8" y="286" width="1164" height="138" rx="10"/>
    <rect class="acc-merchant" x="8" y="286" width="3" height="138" rx="1.5"/>
    <text class="t-role" x="22" y="351.0">Shop</text>
    <text class="t-rolesub" x="22" y="367.0">store workbench</text>
    <rect class="chip" x="144" y="296" width="156" height="34" rx="6"/>
    <rect x="144" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="155" y="316.6">Publish services, prices</text>

    <rect class="chip" x="144" y="338" width="156" height="34" rx="6"/>
    <rect x="144" y="338" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="155" y="358.6">Set slots and capacity</text>

    <rect class="chip" x="316" y="296" width="156" height="34" rx="6"/>
    <rect x="316" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="327" y="316.6">Match booking to order</text>

    <rect class="chip" x="316" y="338" width="156" height="34" rx="6"/>
    <rect x="316" y="338" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="327" y="358.6">Reception: photos, damage</text>

    <rect class="chip" x="316" y="380" width="156" height="34" rx="6"/>
    <rect x="316" y="380" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="327" y="400.6">Ask the owner to confirm</text>

    <rect class="chip" x="488" y="296" width="156" height="34" rx="6"/>
    <rect x="488" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="499" y="316.6">Dispatch to an employee</text>

    <rect class="chip" x="488" y="338" width="156" height="34" rx="6"/>
    <rect x="488" y="338" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="499" y="358.6">Protection photos first</text>

    <rect class="chip" x="488" y="380" width="156" height="34" rx="6"/>
    <rect x="488" y="380" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="499" y="400.6">Track reports, materials</text>

    <rect class="chip" x="660" y="296" width="156" height="34" rx="6"/>
    <rect x="660" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="671" y="316.6">Recheck QC evidence</text>

    <rect class="chip" x="832" y="296" width="156" height="34" rx="6"/>
    <rect x="832" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="843" y="316.6">Redeem the six-digit code</text>

    <rect class="chip" x="832" y="338" width="156" height="34" rx="6"/>
    <rect x="832" y="338" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="843" y="358.6">Hand over, log pickup</text>

    <rect class="chip" x="1004" y="296" width="156" height="34" rx="6"/>
    <rect x="1004" y="296" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="1015" y="316.6">Moderate reviews</text>

    <rect class="chip" x="1004" y="338" width="156" height="34" rx="6"/>
    <rect x="1004" y="338" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="1015" y="358.6">Dashboard, customers</text>

    <rect class="chip" x="1004" y="380" width="156" height="34" rx="6"/>
    <rect x="1004" y="380" width="2.5" height="34" rx="1.25" fill="#1a7f37" opacity=".85"/>
    <text class="t-chip" x="1015" y="400.6">Staff, services, fees</text>

  </g>

  <!-- lane: technician -->
  <g>
    <rect class="lane" x="8" y="476" width="1164" height="138" rx="10"/>
    <rect class="acc-technician" x="8" y="476" width="3" height="138" rx="1.5"/>
    <text class="t-role" x="22" y="541.0">Technician</text>
    <text class="t-rolesub" x="22" y="557.0">bay workbench</text>
    <rect class="chip" x="488" y="486" width="156" height="34" rx="6"/>
    <rect x="488" y="486" width="2.5" height="34" rx="1.25" fill="#8250df" opacity=".85"/>
    <text class="t-chip" x="499" y="506.6">Bind code, accept job</text>

    <rect class="chip" x="488" y="528" width="156" height="34" rx="6"/>
    <rect x="488" y="528" width="2.5" height="34" rx="1.25" fill="#8250df" opacity=".85"/>
    <text class="t-chip" x="499" y="548.6">Process / fault / done</text>

    <rect class="chip" x="488" y="570" width="156" height="34" rx="6"/>
    <rect x="488" y="570" width="2.5" height="34" rx="1.25" fill="#8250df" opacity=".85"/>
    <text class="t-chip" x="499" y="590.6">Report plan, parts, hours</text>

    <rect class="chip" x="660" y="486" width="156" height="34" rx="6"/>
    <rect x="660" y="486" width="2.5" height="34" rx="1.25" fill="#8250df" opacity=".85"/>
    <text class="t-chip" x="671" y="506.6">Sign QC as yourself</text>

    <rect class="chip" x="660" y="528" width="156" height="34" rx="6"/>
    <rect x="660" y="528" width="2.5" height="34" rx="1.25" fill="#8250df" opacity=".85"/>
    <text class="t-chip" x="671" y="548.6">Send to redemption, lock</text>

    <rect class="note" x="144" y="486" width="328" height="42" rx="6"/>
    <text class="t-note" x="153" y="510.4">Not involved: reception is the shop side</text>

    <rect class="note" x="832" y="486" width="328" height="42" rx="6"/>
    <text class="t-note" x="841" y="510.4">Not involved: redemption runs on the owner code</text>

  </g>

  <!-- shared backend -->
  <g>
    <rect class="lane" x="8" y="640" width="1164" height="100" rx="10"/>
    <rect class="acc-shared" x="8" y="640" width="3" height="100" rx="1.5"/>
    <text class="t-role" x="22" y="684.0">Shared backend</text>
    <text class="t-rolesub" x="22" y="699.0">one permission model</text>
    <rect class="chip" x="144" y="654" width="156" height="34" rx="6"/>
    <rect x="144" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="155" y="668.5">Identity, role,</text>
    <text class="t-chip" x="155" y="680.5">permission</text>

    <rect class="chip" x="316" y="654" width="156" height="34" rx="6"/>
    <rect x="316" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="327" y="674.6">Idempotent write, audit</text>

    <rect class="chip" x="488" y="654" width="156" height="34" rx="6"/>
    <rect x="488" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="499" y="674.6">Archive grants, revocable</text>

    <rect class="chip" x="660" y="654" width="156" height="34" rx="6"/>
    <rect x="660" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="671" y="674.6">In-site + fan-out notices</text>

    <rect class="chip" x="832" y="654" width="156" height="34" rx="6"/>
    <rect x="832" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="843" y="674.6">One order / archive model</text>

    <rect class="chip" x="1004" y="654" width="156" height="34" rx="6"/>
    <rect x="1004" y="654" width="2.5" height="34" rx="1.25" fill="#bf8700" opacity=".85"/>
    <text class="t-chip" x="1015" y="674.6">OCR / ASR, off by default</text>

    <text class="t-caption" x="22" y="718">Restricted operator entry: catalogue governance, policy config, content review, reconciliation — internal accounts only, separate permissions</text>
  </g>

  <!-- hand-offs -->
  <g>
    <path class="hand" d="M 222 240 L 222 280" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="0.30s" repeatCount="indefinite" path="M 222 240 L 222 280"/></circle>
    <circle class="badge" cx="222" cy="260.0" r="7.5" stroke="#0969da"/>
    <text class="t-badge" x="222" y="263.2" text-anchor="middle" fill="#0969da">1</text>
    <text class="t-hand" x="210" y="263.2" text-anchor="end">booking + payment → shop</text>
  </g>
  <g>
    <path class="hand-dash" d="M 394 280 L 394 240" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="0.60s" repeatCount="indefinite" path="M 394 280 L 394 240"/></circle>
    <circle class="badge" cx="394" cy="260.0" r="7.5" stroke="#0969da"/>
    <text class="t-badge" x="394" y="263.2" text-anchor="middle" fill="#0969da">2</text>
    <text class="t-hand" x="382" y="263.2" text-anchor="end">reception sheet → owner</text>
  </g>
  <g>
    <path class="hand" d="M 566 430 L 566 470" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="0.90s" repeatCount="indefinite" path="M 566 430 L 566 470"/></circle>
    <circle class="badge" cx="566" cy="450.0" r="7.5" stroke="#1a7f37"/>
    <text class="t-badge" x="566" y="453.2" text-anchor="middle" fill="#1a7f37">3</text>
    <text class="t-hand" x="554" y="453.2" text-anchor="end">dispatch → technician</text>
  </g>
  <g>
    <path class="hand" d="M 738 470 L 738 430" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="1.20s" repeatCount="indefinite" path="M 738 470 L 738 430"/></circle>
    <circle class="badge" cx="738" cy="450.0" r="7.5" stroke="#1a7f37"/>
    <text class="t-badge" x="738" y="453.2" text-anchor="middle" fill="#1a7f37">4</text>
    <text class="t-hand" x="726" y="453.2" text-anchor="end">QC signature → redeemable</text>
  </g>
  <g>
    <path class="hand" d="M 910 240 L 910 280" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="1.50s" repeatCount="indefinite" path="M 910 240 L 910 280"/></circle>
    <circle class="badge" cx="910" cy="260.0" r="7.5" stroke="#0969da"/>
    <text class="t-badge" x="910" y="263.2" text-anchor="middle" fill="#0969da">5</text>
    <text class="t-hand" x="898" y="263.2" text-anchor="end">six-digit code → shop</text>
  </g>
  <g>
    <path class="hand" d="M 1082 280 L 1082 240" marker-end="url(#arw)"/>
    <circle class="pkt" r="2.4" cx="0" cy="0"><animateMotion dur="2.4s" begin="1.80s" repeatCount="indefinite" path="M 1082 280 L 1082 240"/></circle>
    <circle class="badge" cx="1082" cy="260.0" r="7.5" stroke="#0969da"/>
    <text class="t-badge" x="1082" y="263.2" text-anchor="middle" fill="#0969da">6</text>
    <text class="t-hand" x="1070" y="263.2" text-anchor="end">redeemed → auto archive</text>
  </g>

  <!-- legend -->
  <path class="hand" d="M 22 765 L 54 765" marker-end="url(#arw)"/>
  <text class="t-legend" x="62" y="768">Hand-off on the main chain</text>
  <path class="hand-dash" d="M 226.91 765 L 258.90999999999997 765" marker-end="url(#arw)"/>
  <text class="t-legend" x="266.90999999999997" y="768">Confirm / objection loop</text>
  <circle class="dot" cx="437.75" cy="765" r="2.6"/>
  <text class="t-legend" x="461.75" y="768">Request or data in motion</text>
</svg>
