name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提出前请先看 [README 的"能力现状"](https://github.com/Vehicle-Health-Manager-Platform/Vehicle-Health-Manager-Platform/blob/main/README.md#11-能力现状已实现--部分实现--计划)：
        有些能力（如支付、短信、识别模型、向量检索）代码已在仓库里但**默认关闭**，缺的是外部资质或验收，不属于"未实现"。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到什么问题？尽量描述真实流程，而不是抽象需求。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望的交互或接口形态；如涉及权限，请说明谁能做什么。
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 小程序页面与交互
        - 后端接口
        - 数据库结构
        - 权限模型
        - 外部服务接入（微信/短信/支付/识别）
        - 部署与运维
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 现有功能能否变通实现？为什么不够？

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我理解涉及外部资质（微信主体、短信、支付、模型）的部分需要自行准备，仓库不会内置凭据
        - label: 我理解新增能力应默认关闭，并在未配置时返回明确错误
