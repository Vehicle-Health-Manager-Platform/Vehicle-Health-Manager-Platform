name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:legacy-web
  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test --workspace @autocare/miniapp
      - run: npm run build:miniapp
      - run: test -f apps/miniapp/dist/build/mp-weixin/app.json
      - run: npm run build:h5 --workspace @autocare/miniapp
      - run: test -f apps/miniapp/dist/build/h5/index.html
  backend:
    runs-on: ubuntu-latest
    # Full real-MySQL regression plus independently seeded Newman stacks.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build real upload test images
        timeout-minutes: 5
        run: |
          docker build --progress=plain --tag autocare-upload-minio-ci deploy/minio
          docker build --progress=plain --tag autocare-upload-init-ci deploy/upload-init
      - name: Record fresh backend source content before building
        run: python scripts/run_api_acceptance.py --record-ci-sources
      - run: mvn -B -Pcore-coverage -Dupload.test.images.prebuilt=true clean verify
        working-directory: backend
      - name: Check declared core business coverage
        if: always()
        run: python scripts/check_core_coverage.py
      - name: Check isolated HTTP journey evidence
        if: always()
        run: python scripts/run_isolated_journeys.py --check-only
      - name: Check real private upload and signed attachment journey
        if: always()
        run: python scripts/run_upload_acceptance.py --check-only
      - name: Check real service archive consent context and signed attachments
        if: always()
        run: python scripts/run_service_archive_acceptance.py --check-only
      - name: Check real material uploads access and current service workbenches
        if: always()
        run: python scripts/run_material_workbench_acceptance.py --check-only
      - name: Check real pickup and construction attachment permissions and signatures
        if: always()
        run: python scripts/run_pickup_work_files_acceptance.py --check-only
      - name: Check real operator access to merchant onboarding qualification attachments
        if: always()
        run: python scripts/run_merchant_onboarding_files_acceptance.py --check-only
      - name: Check real community image consent moderation and withdrawal
        if: always()
        run: python scripts/run_community_images_acceptance.py --check-only
      - name: Check invitation qualification freeze and scheduled reward delivery
        if: always()
        run: python scripts/run_reward_acceptance.py --check-only
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify anonymous and owner API cases through Newman on an isolated stack
        run: python scripts/run_api_acceptance.py --ci-built-jar --owner-cases
      - name: Verify reservation to archive cases with isolated LOCAL_TEST payments
        run: python scripts/run_api_acceptance.py --ci-built-jar --fulfillment-cases
      - name: Verify coupon lifecycle with isolated LOCAL_TEST notices
        run: python scripts/run_api_acceptance.py --ci-built-jar --coupon-cases
      - name: Verify merchant onboarding staff and operator permissions
        run: python scripts/run_api_acceptance.py --ci-built-jar --merchant-cases
      - name: Verify private community questions and licensed KEYWORD retrieval
        run: python scripts/run_api_acceptance.py --ci-built-jar --community-cases
      - name: Verify public Q&A consent review and withdrawal
        run: python scripts/run_api_acceptance.py --ci-built-jar --publication-cases
      - name: Verify experience consent review withdrawal and curation
        run: python scripts/run_api_acceptance.py --ci-built-jar --experience-cases
      - name: Verify owner structured archives health and reminders
        run: python scripts/run_api_acceptance.py --ci-built-jar --health-cases
      - name: Install PDF evidence reader
        run: python -m pip install -r scripts/requirements-export-qa.txt
      - name: Verify private PDF export and frozen share summaries
        run: python scripts/run_api_acceptance.py --ci-built-jar --export-cases
      - name: Verify point policies check-in and isolated verified ledger
        run: python scripts/run_api_acceptance.py --ci-built-jar --points-cases
      - name: Verify earned points and atomic coupon exchanges
        run: python scripts/run_api_acceptance.py --ci-built-jar --exchange-cases
      - name: Verify invitation codes and monthly qualification policies
        run: python scripts/run_api_acceptance.py --ci-built-jar --invitation-cases
      - name: Verify human diagnosis assignment and local notifications
        run: python scripts/run_api_acceptance.py --ci-built-jar --diagnosis-cases
      - name: Verify local service discovery search and merchant locations
        run: python scripts/run_api_acceptance.py --ci-built-jar --discovery-cases
      - name: Verify merchant quote selection versions and shelving
        run: python scripts/run_api_acceptance.py --ci-built-jar --quotes-cases
      - name: Verify owner review and four independent public grants
        run: python scripts/run_api_acceptance.py --ci-built-jar --reviews-cases
      - name: Financial recovery and commission API cases
        run: python scripts/run_api_acceptance.py --ci-built-jar --finance-cases
      - name: Workflow reads and three-role notification fanout
        run: python scripts/run_api_acceptance.py --ci-built-jar --workflow-cases
      - name: Pickup dispute and resumed fulfillment
        run: python scripts/run_api_acceptance.py --ci-built-jar --dispute-cases
      - name: Assessment policy monthly settlement and business dashboard
        run: python scripts/run_api_acceptance.py --ci-built-jar --assessment-cases
      - name: Session rotation revocation and concurrent refresh
        run: python scripts/run_api_acceptance.py --ci-built-jar --auth-sessions-cases
      - name: Public star service project rating quotes
        run: python scripts/run_api_acceptance.py --ci-built-jar --rating-quotes-cases
      - name: Pickup delivery comparison against finished work evidence
        run: python scripts/run_api_acceptance.py --ci-built-jar --delivery-compare-cases
      - name: Read-only daily local finance records and permission boundaries
        run: python scripts/run_api_acceptance.py --ci-built-jar --local-finance-cases
      - name: Coupon catalog frozen draft revisions and offers eligibility
        run: python scripts/run_api_acceptance.py --ci-built-jar --coupon-catalog-cases
      - name: Store-local customer relations and conservative price comparison reads
        run: python scripts/run_api_acceptance.py --ci-built-jar --relations-price-cases
      - name: Catalog governance and price monitor evidence chain
        run: python scripts/run_api_acceptance.py --ci-built-jar --governance-cases
      - name: Remaining fulfillment views and slot closure
        run: python scripts/run_api_acceptance.py --ci-built-jar --fulfillment-reads-cases
      - name: Vehicle applicability evidence and manual plan booking context
        run: python scripts/run_api_acceptance.py --ci-built-jar --plan-evidence-cases
      - name: Save sanitized API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-acceptance-evidence
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .cache/api-acceptance-*/report.json
            backend/target/private-upload-acceptance.json
            backend/target/service-archive-access-acceptance.json
            backend/target/material-workbench-acceptance.json
            backend/target/pickup-work-files-acceptance.json
            backend/target/merchant-onboarding-files-acceptance.json
            backend/target/community-images-acceptance.json
            backend/target/invitation-reward-acceptance.json
      - name: Save coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-and-tests
          retention-days: 14
          if-no-files-found: warn
          path: |
            backend/target/site/core-coverage/
            backend/target/core-coverage-summary.json
            backend/target/isolated-journeys-run.json
            backend/target/surefire-reports/TEST-*.xml
  schema-and-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check OpenAPI source reproducibility before regenerating assets
        run: |
          python -m unittest discover -s scripts -p test_generate_openapi.py -v
          python -m unittest discover -s scripts -p test_local_finance_contract.py -v
          python scripts/generate_openapi.py --check
      - run: python -m unittest discover -s scripts -p test_core_coverage.py -v
      - run: python -m unittest discover -s scripts -p test_isolated_journeys.py -v
      - run: python -m unittest discover -s scripts -p test_database_recovery.py -v
      - run: python -m unittest discover -s scripts -p test_performance_baseline.py -v
      - run: python -m unittest discover -s scripts -p test_api_acceptance.py -v
      - run: python scripts/generate_api_acceptance.py
      - name: Reconcile API coverage without claiming a new business run
        run: |
          python -m unittest discover -s scripts -p test_api_coverage_summary.py -v
          python scripts/summarize_api_coverage.py --check
      - name: Require every contract operation to be evidenced or explained
        run: |
          python -m unittest discover -s scripts -p test_reconcile_contract.py -v
          python scripts/reconcile_contract.py --check
      - name: Check WeChat handover pages templates and guide links
        run: |
          python -m unittest discover -s scripts -p test_miniapp_handover.py -v
          python -m unittest discover -s scripts -p test_local_delivery.py -v
          python -m unittest discover -s scripts -p test_business_api_acceptance.py -v
          python scripts/miniapp_handover.py --check
      - run: python scripts/owner_api_cases.py
      - run: python -m unittest discover -s scripts -p test_owner_api_cases.py -v
      - run: python scripts/fulfillment_api_cases.py
      - run: python -m unittest discover -s scripts -p test_fulfillment_api_cases.py -v
      - run: python scripts/coupon_api_cases.py
      - run: python -m unittest discover -s scripts -p test_coupon_api_cases.py -v
      - run: python -m unittest discover -s scripts -p test_ci_build_evidence.py -v
      - run: python scripts/merchant_api_cases.py
      - run: python -m unittest discover -s scripts -p test_merchant_api_cases.py -v
      - run: python -m unittest discover -s scripts -p test_owned_cleanup.py -v
      - run: python scripts/community_api_cases.py
      - run: python -m unittest discover -s scripts -p test_community_api_cases.py -v
      - run: python scripts/publication_api_cases.py
      - run: python -m unittest discover -s scripts -p test_publication_api_cases.py -v
      - run: python scripts/experience_api_cases.py
      - run: python -m unittest discover -s scripts -p test_experience_api_cases.py -v
      - run: python scripts/health_api_cases.py
      - run: python -m unittest discover -s scripts -p test_health_api_cases.py -v
      - run: python scripts/points_api_cases.py
      - run: python -m unittest discover -s scripts -p test_points_api_cases.py -v
      - run: python scripts/exchange_api_cases.py
      - run: python -m unittest discover -s scripts -p test_exchange_api_cases.py -v
      - run: python -m unittest discover -s scripts -p test_service_archive_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_material_workbench_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_real_mileage_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_linux_ocr_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_linux_mileage_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_linux_mileage_faults.py -v
      - run: python -m unittest discover -s scripts -p test_pickup_work_files_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_merchant_onboarding_files_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_community_images_acceptance.py -v
      - run: python scripts/quotes_api_cases.py
      - run: python -m unittest discover -s scripts -p test_quotes_api_cases.py -v
      - run: python scripts/discovery_api_cases.py
      - run: python -m unittest discover -s scripts -p test_discovery_api_cases.py -v
      - run: python scripts/diagnosis_api_cases.py
      - run: python -m unittest discover -s scripts -p test_diagnosis_api_cases.py -v
      - run: python scripts/invitation_api_cases.py
      - run: python -m unittest discover -s scripts -p test_invitation_api_cases.py -v
      - run: python scripts/reviews_api_cases.py
      - run: python scripts/dispute_api_cases.py
      - run: python -m unittest discover -s scripts -p test_dispute_api_cases.py -v
      - run: python scripts/workflow_api_cases.py
      - run: python -m unittest discover -s scripts -p test_workflow_api_cases.py -v
      - run: python scripts/finance_api_cases.py
      - run: python -m unittest discover -s scripts -p test_finance_api_cases.py -v
      - run: python -m unittest discover -s scripts -p test_reviews_api_cases.py -v
      - run: python scripts/assessment_api_cases.py
      - run: python -m unittest discover -s scripts -p test_assessment_api_cases.py -v
      - run: python scripts/plan_evidence_api_cases.py
      - run: python -m unittest discover -s scripts -p test_plan_evidence_api_cases.py -v
      - run: python scripts/fulfillment_reads_api_cases.py
      - run: python -m unittest discover -s scripts -p test_fulfillment_reads_api_cases.py -v
      - run: python scripts/auth_sessions_api_cases.py
      - run: python -m unittest discover -s scripts -p test_auth_sessions_api_cases.py -v
      - run: python scripts/coupon_catalog_api_cases.py
      - run: python -m unittest discover -s scripts -p test_coupon_catalog_api_cases.py -v
      - run: python scripts/relations_price_api_cases.py
      - run: python -m unittest discover -s scripts -p test_relations_price_api_cases.py -v
      - run: python scripts/governance_api_cases.py
      - run: python -m unittest discover -s scripts -p test_governance_api_cases.py -v
      - run: python scripts/rating_quotes_api_cases.py
      - run: python -m unittest discover -s scripts -p test_rating_quotes_api_cases.py -v
      - run: python scripts/delivery_compare_api_cases.py
      - run: python -m unittest discover -s scripts -p test_delivery_compare_api_cases.py -v
      - run: python scripts/local_finance_api_cases.py
      - run: python -m unittest discover -s scripts -p test_local_finance_api_cases.py -v
      - run: python -m pip install -r scripts/requirements-export-qa.txt
      - run: python -m unittest discover -s scripts -p test_upload_acceptance.py -v
      - run: python -m unittest discover -s scripts -p test_reward_acceptance.py -v
      - run: python scripts/export_api_cases.py
      - run: python -m unittest discover -s scripts -p test_export_api_cases.py -v
      - run: git diff --exit-code -- docs/testing/postman/
      - run: python scripts/generate_traceability.py
      - run: python scripts/build_init_sql.py
      - run: python scripts/generate_openapi.py
      - run: python scripts/verify_compose_migrations.py
      - run: git diff --exit-code -- docs/progress/S0_TRACEABILITY.csv docs/sql/init.sql docs/sql/migrations/V001__baseline.sql docs/api/openapi.json
      - run: python -m py_compile services/ocr/src/server.py
      - run: python -m pip install -r services/ocr/requirements.txt
      - run: python -m unittest discover -s services/ocr -p 'test_*.py'
      - run: python -m unittest discover -s services/asr -p 'test_*.py'
      - run: python -m unittest discover -s services/documents -p 'test_*.py'
      - run: python -m unittest discover -s services/embedding -p 'test_*.py'
  schema-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify_mysql_schema.sh
  database-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise isolated backup restore and upgrade rollback
        run: python scripts/run_database_recovery.py
      - name: Save recovery evidence without SQL dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-recovery-evidence
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: .cache/database-recovery-*/report.json
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [web, backend, schema-mysql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:legacy-web
      - run: bash scripts/verify_compose.sh
  performance-baseline:
    runs-on: ubuntu-latest
    # Builds the jar in a Maven container, then measures 500-concurrency reads and writes.
    # The runner size is not controlled, so CI enforces the error budget only; latency is
    # measured and published, and the recorded acceptance run is the fixed-hardware report.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Measure 500-concurrency core baseline
        run: python scripts/run_performance_baseline.py --gates errors --report performance-baseline.json
      - name: Check baseline evidence consistency
        if: success()
        run: python scripts/run_performance_baseline.py --check-only performance-baseline.json
      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-evidence
          retention-days: 14
          if-no-files-found: warn
          path: performance-baseline.json
