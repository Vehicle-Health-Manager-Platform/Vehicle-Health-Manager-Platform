name: vehicle-health-manager

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../docs/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ../../docs/sql/migrations/V002__staff_wechat_identity.sql:/docker-entrypoint-initdb.d/002-staff-wechat-identity.sql:ro
      - ../../docs/sql/migrations/V003__auth_lifecycle.sql:/docker-entrypoint-initdb.d/003-auth-lifecycle.sql:ro
      - ../../docs/sql/migrations/V004__upload_http.sql:/docker-entrypoint-initdb.d/004-upload-http.sql:ro
      - ../../docs/sql/migrations/V005__vehicle_archive_files.sql:/docker-entrypoint-initdb.d/005-vehicle-archive-files.sql:ro
      - ../../docs/sql/migrations/V006__merchant_project_versions.sql:/docker-entrypoint-initdb.d/006-merchant-project-versions.sql:ro
      - ../../docs/sql/migrations/V007__reservation_orders.sql:/docker-entrypoint-initdb.d/007-reservation-orders.sql:ro
      - ../../docs/sql/migrations/V008__payment_foundation.sql:/docker-entrypoint-initdb.d/008-payment-foundation.sql:ro
      - ../../docs/sql/migrations/V009__order_fulfillment_states.sql:/docker-entrypoint-initdb.d/009-order-fulfillment-states.sql:ro
      - ../../docs/sql/migrations/V010__pickup_inspection.sql:/docker-entrypoint-initdb.d/010-pickup-inspection.sql:ro
      - ../../docs/sql/migrations/V011__pickup_owner_decision.sql:/docker-entrypoint-initdb.d/011-pickup-owner-decision.sql:ro
      - ../../docs/sql/migrations/V012__technician_dispatch.sql:/docker-entrypoint-initdb.d/012-technician-dispatch.sql:ro
      - ../../docs/sql/migrations/V013__dispute_resolution.sql:/docker-entrypoint-initdb.d/013-dispute-resolution.sql:ro
      - ../../docs/sql/migrations/V014__service_work.sql:/docker-entrypoint-initdb.d/014-service-work.sql:ro
      - ../../docs/sql/migrations/V015__order_redemption.sql:/docker-entrypoint-initdb.d/015-order-redemption.sql:ro
      - ../../docs/sql/migrations/V016__order_reviews.sql:/docker-entrypoint-initdb.d/016-order-reviews.sql:ro
      - ../../docs/sql/migrations/V017__service_archive_jobs.sql:/docker-entrypoint-initdb.d/017-service-archive-jobs.sql:ro
      - ../../docs/sql/migrations/V018__experience_cards.sql:/docker-entrypoint-initdb.d/018-experience-cards.sql:ro
      - ../../docs/sql/migrations/V019__experience_moderation.sql:/docker-entrypoint-initdb.d/019-experience-moderation.sql:ro
      - ../../docs/sql/migrations/V020__merchant_onboarding.sql:/docker-entrypoint-initdb.d/020-merchant-onboarding.sql:ro
      - ../../docs/sql/migrations/V021__merchant_staff_store.sql:/docker-entrypoint-initdb.d/021-merchant-staff-store.sql:ro
      - ../../docs/sql/migrations/V022__catalog_governance.sql:/docker-entrypoint-initdb.d/022-catalog-governance.sql:ro
      - ../../docs/sql/migrations/V023__completion_archive_jobs.sql:/docker-entrypoint-initdb.d/023-completion-archive-jobs.sql:ro
      - ../../docs/sql/migrations/V024__payment_query_recovery.sql:/docker-entrypoint-initdb.d/024-payment-query-recovery.sql:ro
      - ../../docs/sql/migrations/V025__order_refunds.sql:/docker-entrypoint-initdb.d/025-order-refunds.sql:ro
      - ../../docs/sql/migrations/V026__commission_ledger.sql:/docker-entrypoint-initdb.d/026-commission-ledger.sql:ro
      - ../../docs/sql/migrations/V027__archive_report_shares.sql:/docker-entrypoint-initdb.d/027-archive-report-shares.sql:ro
      - ../../docs/sql/migrations/V028__archive_reminders.sql:/docker-entrypoint-initdb.d/028-archive-reminders.sql:ro
      - ../../docs/sql/migrations/V029__archive_structured_details.sql:/docker-entrypoint-initdb.d/029-archive-structured-details.sql:ro
      - ../../docs/sql/migrations/V030__vehicle_health_observations.sql:/docker-entrypoint-initdb.d/030-vehicle-health-observations.sql:ro
      - ../../docs/sql/migrations/V031__vehicle_health_observation_history.sql:/docker-entrypoint-initdb.d/031-vehicle-health-observation-history.sql:ro
      - ../../docs/sql/migrations/V032__merchant_location.sql:/docker-entrypoint-initdb.d/032-merchant-location.sql:ro
      - ../../docs/sql/migrations/V033__review_publication.sql:/docker-entrypoint-initdb.d/033-review-publication.sql:ro
      - ../../docs/sql/migrations/V034__public_review_text.sql:/docker-entrypoint-initdb.d/034-public-review-text.sql:ro
      - ../../docs/sql/migrations/V035__review_summary_consent.sql:/docker-entrypoint-initdb.d/035-review-summary-consent.sql:ro
      - ../../docs/sql/migrations/V036__project_model_applicability.sql:/docker-entrypoint-initdb.d/036-project-model-applicability.sql:ro
      - ../../docs/sql/migrations/V037__health_policies_and_confirmations.sql:/docker-entrypoint-initdb.d/037-health-policies-and-confirmations.sql:ro
      - ../../docs/sql/migrations/V038__coupon_inventory_and_claims.sql:/docker-entrypoint-initdb.d/038-coupon-inventory-and-claims.sql:ro
      - ../../docs/sql/migrations/V039__coupon_transactions.sql:/docker-entrypoint-initdb.d/039-coupon-transactions.sql:ro
      - ../../docs/sql/migrations/V040__invitation_attribution.sql:/docker-entrypoint-initdb.d/040-invitation-attribution.sql:ro
      - ../../docs/sql/migrations/V041__invitation_reward_policies.sql:/docker-entrypoint-initdb.d/041-invitation-reward-policies.sql:ro
      - ../../docs/sql/migrations/V042__invitation_reward_delivery.sql:/docker-entrypoint-initdb.d/042-invitation-reward-delivery.sql:ro
      - ../../docs/sql/migrations/V043__invitation_diagnosis_unlock.sql:/docker-entrypoint-initdb.d/043-invitation-diagnosis-unlock.sql:ro
      - ../../docs/sql/migrations/V044__order_archive_grants.sql:/docker-entrypoint-initdb.d/044-order-archive-grants.sql:ro
      - ../../docs/sql/migrations/V045__service_notification_outbox.sql:/docker-entrypoint-initdb.d/045-service-notification-outbox.sql:ro
      - ../../docs/sql/migrations/V046__async_diagnosis.sql:/docker-entrypoint-initdb.d/046-async-diagnosis.sql:ro
      - ../../docs/sql/migrations/V047__order_notification_sources.sql:/docker-entrypoint-initdb.d/047-order-notification-sources.sql:ro
      - ../../docs/sql/migrations/V048__diagnosis_notifications.sql:/docker-entrypoint-initdb.d/048-diagnosis-notifications.sql:ro
      - ../../docs/sql/migrations/V049__point_task_policies.sql:/docker-entrypoint-initdb.d/049-point-task-policies.sql:ro
      - ../../docs/sql/migrations/V050__verified_points_ledger.sql:/docker-entrypoint-initdb.d/050-verified-points-ledger.sql:ro
      - ../../docs/sql/migrations/V051__point_exchange_catalog.sql:/docker-entrypoint-initdb.d/051-point-exchange-catalog.sql:ro
      - ../../docs/sql/migrations/V052__atomic_point_exchange.sql:/docker-entrypoint-initdb.d/052-atomic-point-exchange.sql:ro
      - ../../docs/sql/migrations/V053__assessment_policies.sql:/docker-entrypoint-initdb.d/053-assessment-policies.sql:ro
      - ../../docs/sql/migrations/V054__assessment_monthly_snapshots.sql:/docker-entrypoint-initdb.d/054-assessment-monthly-snapshots.sql:ro
      - ../../docs/sql/migrations/V055__business_dashboard_permission.sql:/docker-entrypoint-initdb.d/055-business-dashboard-permission.sql:ro
      - ../../docs/sql/migrations/V056__price_monitor_policies.sql:/docker-entrypoint-initdb.d/056-price-monitor-policies.sql:ro
      - ../../docs/sql/migrations/V057__curated_experiences.sql:/docker-entrypoint-initdb.d/057-curated-experiences.sql:ro
      - ../../docs/sql/migrations/V058__private_community_questions.sql:/docker-entrypoint-initdb.d/058-private-community-questions.sql:ro
      - ../../docs/sql/migrations/V059__public_community_questions.sql:/docker-entrypoint-initdb.d/059-public-community-questions.sql:ro
      - ../../docs/sql/migrations/V060__public_image_copies.sql:/docker-entrypoint-initdb.d/060-public-image-copies.sql:ro
      - ../../docs/sql/migrations/V061__licensed_knowledge.sql:/docker-entrypoint-initdb.d/061-licensed-knowledge.sql:ro
      - ../../docs/sql/migrations/V062__input_material.sql:/docker-entrypoint-initdb.d/062-input-material.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8
    restart: unless-stopped

  minio:
    build: ../minio
    image: vehicle-health/minio:RELEASE.2025-07-23T15-54-02Z
    platform: linux/amd64
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio_data:/data"]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes: ["etcd_data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.5.4
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    volumes: ["milvus_data:/var/lib/milvus"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9091/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  ocr:
    build: ../../services/ocr
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 128
    shm_size: 16m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=67108864,mode=1777
    environment:
      OCR_PORT: 8090
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      PADDLE_PDX_CACHE_HOME: /tmp/paddlex
      PADDLE_HOME: /tmp/paddle
      HF_HOME: /tmp/huggingface
      MODELSCOPE_CACHE: /tmp/modelscope
      XDG_CACHE_HOME: /tmp/xdg
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8090/health', timeout=3)); assert r.get('status')=='UP' and (os.environ.get('OCR_ENABLED')!='true' or r.get('recognition') in ('READY','BUSY'))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ../../backend
    environment:
      SERVER_PORT: 8080
      UPLOAD_HTTP_CONCURRENCY: ${UPLOAD_HTTP_CONCURRENCY:-4}
      UPLOAD_CLEANUP_INTERVAL_MS: ${UPLOAD_CLEANUP_INTERVAL_MS:-60000}
      INPUT_MATERIAL_UPLOAD_ENABLED: ${INPUT_MATERIAL_UPLOAD_ENABLED:-false}
      MILEAGE_OCR_ENABLED: ${MILEAGE_OCR_ENABLED:-false}
      MILEAGE_OCR_URL: ${MILEAGE_OCR_URL:-}
      MILEAGE_OCR_SERVICE_TOKEN: ${MILEAGE_OCR_SERVICE_TOKEN:-}
      MILEAGE_OCR_ALLOW_PRIVATE_HTTP: ${MILEAGE_OCR_ALLOW_PRIVATE_HTTP:-false}
      MYSQL_HOST: mysql
      SERVICE_ARCHIVE_ENABLED: ${SERVICE_ARCHIVE_ENABLED:-false}
      EXPERIENCE_CARD_ENABLED: ${EXPERIENCE_CARD_ENABLED:-false}
      EXPERIENCE_PUBLICATION_ENABLED: ${EXPERIENCE_PUBLICATION_ENABLED:-false}
      COMMUNITY_PUBLICATION_ENABLED: ${COMMUNITY_PUBLICATION_ENABLED:-false}
      PUBLIC_IMAGES_ENABLED: ${PUBLIC_IMAGES_ENABLED:-false}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      KNOWLEDGE_AI_ENABLED: ${KNOWLEDGE_AI_ENABLED:-false}
      INVITE_VERIFIED_IDENTITY_ENABLED: ${INVITE_VERIFIED_IDENTITY_ENABLED:-false}
      INVITE_REWARD_ENABLED: ${INVITE_REWARD_ENABLED:-false}
      POINTS_EXCHANGE_ENABLED: ${POINTS_EXCHANGE_ENABLED:-false}
      POINTS_EARNING_ENABLED: ${POINTS_EARNING_ENABLED:-false}
      POINTS_VERIFIED_IDENTITY_ENABLED: ${POINTS_VERIFIED_IDENTITY_ENABLED:-false}
      POINTS_AI_VERIFIED_ENABLED: ${POINTS_AI_VERIFIED_ENABLED:-false}
      POINTS_RECOVERY_DELAY_MS: ${POINTS_RECOVERY_DELAY_MS:-5000}
      REVIEW_TEXT_PUBLICATION_ENABLED: ${REVIEW_TEXT_PUBLICATION_ENABLED:-false}
      REVIEW_SUMMARY_ENABLED: ${REVIEW_SUMMARY_ENABLED:-false}
      AI_SERVICE_PLAN_ENABLED: ${AI_SERVICE_PLAN_ENABLED:-false}
      SERVICE_ARCHIVE_INTERVAL_MS: ${SERVICE_ARCHIVE_INTERVAL_MS:-60000}
      SERVICE_NOTIFICATION_DELAY_MS: ${SERVICE_NOTIFICATION_DELAY_MS:-5000}
      PAYMENT_QUERY_RECOVERY_ENABLED: ${PAYMENT_QUERY_RECOVERY_ENABLED:-false}
      PAYMENT_QUERY_RECOVERY_INTERVAL_MS: ${PAYMENT_QUERY_RECOVERY_INTERVAL_MS:-60000}
      PAYMENT_LOCAL_TEST_QUERY_URL: ${PAYMENT_LOCAL_TEST_QUERY_URL:-}
      REFUND_RECOVERY_ENABLED: ${REFUND_RECOVERY_ENABLED:-false}
      REFUND_RECOVERY_INTERVAL_MS: ${REFUND_RECOVERY_INTERVAL_MS:-60000}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      JWT_SECRET: ${JWT_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-unconfigured}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8082:81"
      - "127.0.0.1:8083:82"
      - "127.0.0.1:8084:83"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/owner/dist:/var/www/owner:ro
      - ../../apps/merchant/dist:/var/www/merchant:ro
      - ../../apps/technician/dist:/var/www/technician:ro
      - ../../apps/admin/dist:/var/www/admin:ro
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on:
      backend: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  etcd_data:
  milvus_data:
  prometheus_data:
