upstream api_backend { server backend:8080; }

server {
    listen 80;
    server_name _;
    root /var/www/owner;
    index index.html;
    location = /api/file/upload {
        client_max_body_size 11m;
        client_body_timeout 30s;
        proxy_read_timeout 80s;
        proxy_send_timeout 30s;
        error_page 413 = @upload_too_large;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location @upload_too_large {
        default_type application/json;
        return 413 '{"code":41300,"message":"上传请求过大","data":null,"request_id":"$request_id"}';
    }
    location /api/ { proxy_pass http://api_backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
